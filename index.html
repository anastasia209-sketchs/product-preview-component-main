<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <section class="image">
        <img
          src="./images/image-product-mobile.jpg"
          alt="a square perfume on table"
          class="mobile-hero"
        />

         <img src="./images/image-product-desktop.jpg" alt="a glass perfume"
         class="desktop-hero">
        
      </section>
      <section class="design">
        <h2 class="pre">Perfume</h2>

        <h1 class="perfume">Gabrielle Essence Eau De Parfum</h1>

        <p class="about">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="price">
          <p class="new-price">$149.99</p>

          <p class="old-price">$169.99</p>
        </div>

        <div class="btn">
          <button type="submit" class="btn-cart">
            <img src="./images/icon-cart.svg" alt="cart" class="cart-icon" />Add
            to Cart
          </button>
        </div>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anastasia Hannah</a>.
    </footer>
  </body>
</html>
